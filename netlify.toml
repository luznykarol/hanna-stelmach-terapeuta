[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro outputs a fully static site by default, so no adapter/redirects are needed here.
# When Storyblok is added, set STORYBLOK_TOKEN in Netlify → Site settings → Environment variables,
# and add a Build Hook (Site settings → Build & deploy → Build hooks) so publishing content
# in Storyblok triggers a redeploy.

# Fingerprinted build output and self-hosted fonts never change under the same
# URL, so they can be cached for a year. Without this Netlify serves them with a
# short max-age and Lighthouse flags "efficient cache policy" on every repeat visit.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
